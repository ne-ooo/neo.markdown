name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LPM_VERSION: "0.75.0"

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["18.20.8", "26"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install LPM
        run: npm install --global "@lpm-registry/cli@${LPM_VERSION}"

      - name: Install the locked dependency graph
        if: matrix.node != '18.20.8'
        run: lpm ci --strict-integrity --no-skills --no-editor-setup --no-security-summary --policy=deny

      - name: Install the locked dependency graph on Node.js 18
        if: matrix.node == '18.20.8'
        run: lpm ci --strict-integrity --no-skills --no-editor-setup --no-security-summary --policy=deny --no-engine-strict

      - name: Verify the lockfile stayed frozen
        run: git diff --exit-code -- package.json lpm.lock

      - name: Run the release gate
        run: lpm run release:check

      - name: Check the publishable package
        run: lpm publish --check --yes
